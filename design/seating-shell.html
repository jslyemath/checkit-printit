<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating — proposed shell, v2</title>
<style>
/* ------------------------------------------------------------------
   A mockup, not the app. Nothing is wired up. Spec: 12.12 of
   PRINT_TOOL_DESIGN.md.
   ------------------------------------------------------------------ */

:root {
  --paper:      oklch(0.971 0.003 255);
  --paper-dot:  oklch(0.893 0.006 255);

  --chrome:      oklch(0.255 0.012 260);
  --chrome-2:    oklch(0.320 0.013 260);
  --chrome-line: oklch(0.380 0.015 260);
  --chrome-ink:  oklch(0.955 0.004 260);
  --chrome-dim:  oklch(0.700 0.010 260);
  --accent:      oklch(0.820 0.115 165);
  --accent-ink:  oklch(0.230 0.040 165);

  --shadow: 0 6px 22px oklch(0.2 0.02 260 / .30),
            0 1px 3px oklch(0.2 0.02 260 / .22);
  --r: 12px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: oklch(0.17 0.008 260);
  color: oklch(0.72 0.01 260);
  padding: 14px;
}
.caption { font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
           margin: 0 0 7px; color: oklch(0.62 0.012 260); }
.caption b { color: oklch(0.88 0.01 260); font-weight: 600; }
.frame { overflow: hidden; border-radius: 10px; margin-bottom: 26px;
         border: 1px solid oklch(0.30 0.012 260); }

/* ---------------------------------------------------------- canvas -- */

.stage {
  position: relative;
  transform-origin: top left;
  background:
    radial-gradient(var(--paper-dot) 1.1px, transparent 1.1px) 0 0 / 26px 26px,
    var(--paper);
}
.room { position: absolute; left: 50%; top: 50%;
        width: 910px; height: 500px; transform-origin: center; }

/* A group owns a hue. Three shades, three jobs -- the table recedes,
   the card lifts off the table, the pill is the one saturated thing.
   `--c` scales the chroma, so an ungrouped student is the same three
   roles at zero: being grey IS the status, and needs no caption. */
.group {
  --c: 1;
  --surface:  oklch(0.935 calc(0.048 * var(--c)) var(--h));
  --edge:     oklch(0.845 calc(0.075 * var(--c)) var(--h));
  --card:     oklch(0.993 calc(0.011 * var(--c)) var(--h));
  --card-edge:oklch(0.880 calc(0.055 * var(--c)) var(--h));
  --solid:    oklch(0.585 calc(0.155 * var(--c)) var(--h));
  --ink:      oklch(0.330 calc(0.085 * var(--c)) var(--h));
  position: absolute;
}
.table { position: absolute; inset: 0; background: var(--surface);
         border: 1.5px solid var(--edge); border-radius: 14px; }

.card {
  position: absolute; width: 104px; height: 56px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--card); border: 1.5px solid var(--card-edge);
  border-radius: 8px; text-align: center; overflow: hidden;
  box-shadow: 0 1px 2px oklch(0.4 0.02 var(--h) / .18);
}
.card b { display: block; font-size: 26px; font-weight: 700; line-height: 1.02;
          color: var(--ink); letter-spacing: -.01em; }
.card s { display: block; font-size: 12px; text-decoration: none;
          color: oklch(0.52 calc(0.045 * var(--c)) var(--h)); line-height: 1.1; }
.card i { position: absolute; top: 2px; right: 6px; font-style: normal;
          font-size: 12px; font-weight: 800; color: var(--solid); }

/* The pill. A different silhouette on purpose: everything else in the
   room is a rounded rectangle, so the one thing that is not reads as a
   label rather than as another object. */
.pill {
  position: absolute; transform: translate(-50%, -50%);
  padding: 4px 13px; border-radius: 999px;
  background: var(--solid); color: white;
  font-size: 13px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; white-space: nowrap;
  box-shadow: 0 2px 6px oklch(0.4 0.06 var(--h) / .35);
}
.pill.held { outline: 2px solid white; outline-offset: 2px;
             box-shadow: 0 6px 16px oklch(0.4 0.06 var(--h) / .5); }

/* The nine anchors, shown because the group is selected. There is no
   picker control: you drag the pill onto one. */
.anchor { position: absolute; width: 9px; height: 9px;
          margin: -4.5px 0 0 -4.5px; border-radius: 50%;
          background: white; border: 1.5px solid var(--edge); }
.anchor.on { background: var(--solid); border-color: var(--solid); }

/* ---------------------------------------------------------- islands -- */

.island {
  position: absolute; z-index: 5;
  display: flex; align-items: center; gap: 6px; padding: 6px;
  background: var(--chrome); border: 1px solid var(--chrome-line);
  border-radius: var(--r); box-shadow: var(--shadow); color: var(--chrome-ink);
}
.island button {
  font: inherit; display: flex; align-items: center; gap: 6px;
  padding: 7px 11px; border: 1px solid transparent; border-radius: 8px;
  background: none; color: var(--chrome-dim); cursor: pointer;
}
.island button:hover { background: var(--chrome-2); color: var(--chrome-ink); }
.island button.on,
.island button.key { background: var(--accent); color: var(--accent-ink);
                     font-weight: 600; }
.island .sep { width: 1px; align-self: stretch;
               background: var(--chrome-line); margin: 2px 2px; }
.island svg { width: 17px; height: 17px; fill: none; stroke: currentColor;
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.at-tl { top: 14px; left: 14px; }
.at-tr { top: 14px; right: 14px; }
.at-bl { bottom: 14px; left: 14px; }
.at-bc { bottom: 14px; left: 50%; transform: translateX(-50%); }

/* unsaved: a dot, and the word only while it means something. */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* The mode rail. Modes only -- Shuffle is an action and lives in the
   menu, because an action among modes is a category error. */
.rail button { flex-direction: column; gap: 3px; padding: 7px 12px; font-size: 11px; }
.rail svg { width: 19px; height: 19px; }

/* The selection strip: thin, above the rail, with no expanded state.
   A colour dot that opens swatches, a label you click to rename, and
   the print position as a fraction. */
.strip {
  bottom: 86px; left: 50%; transform: translateX(-50%);
  padding: 5px 7px; gap: 2px; font-size: 13px;
}
.strip .swatch { width: 17px; height: 17px; border-radius: 50%;
                 background: oklch(0.585 0.155 150); margin: 0 7px 0 5px;
                 border: 2px solid var(--chrome-2); cursor: pointer; }
.strip .name { padding: 3px 8px; border-radius: 6px; cursor: text;
               color: var(--chrome-ink); font-weight: 600; }
.strip .name:hover { background: var(--chrome-2); }
.strip .meta { color: var(--chrome-dim); font-size: 12px; padding: 0 7px; }
.strip .ord { font-variant-numeric: tabular-nums; color: var(--chrome-ink);
              background: var(--chrome-2); border-radius: 6px;
              padding: 3px 8px; cursor: pointer; }

/* The unseated. Same card as a seated student, grey because it has no
   group. The rail has no header and hides itself when it is empty. */
/* No container. An earlier draft gave it a panel and the panel was a
   dark slab across two tables -- the cards are the content, and a box
   round them is a wall for no reason. The well only appears while a
   name is being dragged, which is the one moment somewhere-to-put-a-
   person needs to be a visible target. */
.pen {
  position: absolute; z-index: 5; top: 70px; bottom: 76px; right: 14px;
  display: flex; flex-direction: column; gap: 9px; padding: 8px;
  border: 1px dashed transparent; border-radius: var(--r);
  overflow: auto;
}
.pen.dropping {
  border-color: var(--accent);
  background: oklch(0.255 0.012 260 / .35);
}
.pen .card { position: static; flex: 0 0 auto;
             box-shadow: 0 3px 10px oklch(0.2 0.02 260 / .28); }

.note { position: absolute; left: 14px; bottom: 76px; z-index: 6;
        font-size: 11px; color: oklch(0.50 0.012 260); }

/* ------------------------------------------- the narrow arrangement -- */

/* One breakpoint. The rail drops its words, the sections fold into the
   menu, the pen narrows. Nothing moves to a different corner -- that
   was the fault in v1, where zoom was bottom left when wide and top
   right when narrow. */
.narrow .rail button { padding: 7px 7px; font-size: 0; gap: 0; }
.narrow .rail svg { width: 20px; height: 20px; }
.narrow .foldaway { display: none; }
.narrow .pen { top: 62px; bottom: 132px; padding: 7px; }
.narrow .pen .card { width: 86px; height: 48px; }
.narrow .pen .card b { font-size: 20px; }
/* Still centred, still only as wide as its contents -- the whole point
   of making it thin was that it does not need the width. */
.narrow .strip { bottom: 80px; }
.narrow .note { display: none; }
</style>
</head>

<script>
/* Same markup into both frames: a mockup that drifts from itself
   argues for nothing. */
function board(into, w, h, narrow) {
  const stage = document.getElementById("t").content
                  .cloneNode(true).firstElementChild;
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  if (narrow) stage.classList.add("narrow");

  const box = document.getElementById(into);
  const k = Math.min(1, (document.documentElement.clientWidth - 30) / w);
  stage.style.transform = `scale(${k})`;
  box.style.width = Math.round(w * k) + "px";
  box.style.height = Math.round(h * k) + "px";
  box.appendChild(stage);

  /* Fitted the way the real canvas should fit: to the content, inside
     what the islands leave -- and centred in *that*, not in the whole
     stage, so Fit never parks a table under the unseated rail. */
  const pen = narrow ? 104 : 136;
  const room = stage.querySelector(".room");
  const fit = Math.min((w - pen - 54) / 910, (h - 190) / 500);
  /* Centred in the space the rail leaves, by moving the element rather
     than by adding a translate to the chain -- `scale` sits to the
     right of `translate` in a transform list, so a pixel offset written
     there is applied in already-scaled space and lands in the wrong
     place at every zoom but 100%. `transform-origin: center` then keeps
     the visual centre on the layout centre. */
  room.style.left = Math.round((w - pen) / 2) + "px";
  room.style.top = Math.round(h / 2) + "px";
  room.style.transform = `translate(-50%, -50%) scale(${fit})`;
}
board("wide", 1180, 740, false);
board("narrow", 515, 530, true);
</script>
