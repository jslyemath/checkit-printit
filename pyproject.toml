[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkit-printit"
version = "0.2.0"
description = "Print a class set of CheckIt exercises: many versions, distributed by seating, with answer keys."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    # Class lists arrive as .xlsx as often as .csv -- a Banner summary export
    # is a workbook with a preamble above the table. Requiring a save-as-CSV
    # first would defeat an importer whose purpose is removing manual steps.
    "openpyxl>=3.1",
    # Scans reads marked papers back out of the copier's PDFs, which needs a
    # rasteriser and a barcode reader. Both are chosen for the same reason:
    # they ship self-contained wheels on Windows, so `pip install` is the
    # whole installation.
    #
    # The alternatives each want something the instructor would have to go and
    # fetch -- pdf2image needs poppler on PATH, pyzbar needs a zbar DLL -- and
    # a feature that works here and asks the user to install a binary is a
    # feature that does not work.
    #
    # pypdfium2 bundles PDFium. PyMuPDF is the more usual answer and is AGPL,
    # which is not a licence to hand a university department by accident.
    "pypdfium2>=4",
    # zxing-cpp rather than OpenCV: cv2 is a ~60MB dependency whose QR
    # detector is weaker on small printed symbols, which is exactly this case
    # -- an 11mm code in a 200dpi scan.
    "zxing-cpp>=2",
    # Both of these were load-bearing and undeclared. `scans` has imported
    # numpy and PIL inside its functions since it was written -- every reading
    # of a grading box goes through them -- and they were only ever present
    # because matplotlib, a long way down the chain from checkit-dashboard,
    # happens to pull numpy in, and because this machine had Pillow already.
    # An install without matplotlib would have got as far as the first scan.
    #
    # Now more than load-bearing: the handwritten-id recogniser in `digits`
    # is numpy arithmetic and nothing else, which is the whole reason it
    # needs no model runner installed.
    "numpy>=1.24",
    "pillow>=10",
    # This tool imports checkit -- `from checkit.bank import Bank` -- so it is
    # a real dependency, and leaving it undeclared meant `pip install` could
    # succeed and then fail at the first command with an import error.
    #
    # It is given as a URL because the name `checkit-dashboard` on PyPI is the
    # upstream project, which is different code: declaring the bare name would
    # install the wrong thing, which is worse than declaring nothing. A direct
    # URL cannot be uploaded to PyPI, which is fine -- this is installed from
    # GitHub, and the day it goes to PyPI both packages need new names anyway.
    "checkit-dashboard @ https://github.com/jslyemath/checkit/releases/download/v0.2.9.1/checkit_dashboard-0.2.9.1-py3-none-any.whl",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
checkit-printit = "checkit_printit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# gui/static ships with the package. Left out, `pip install` succeeds and
# `checkit-printit gui` then serves 404s for its own page -- the same shape as
# the 0.2.8.5 release whose install had never worked for anyone.
#
# `**`, not `*`. A single star matches files in `static` and stops there, so
# the built wheel carried app.js, index.html and style.css and left behind
# both web fonts and the whole of `static/seating` -- an installed copy served
# the seating view with no stylesheet and no script at all. Found by building
# a wheel and listing what was in it, which is the only way this is ever
# found: the repository has every file, so every check run against a working
# tree passes.
#
# data/digits.npz is the handwritten-digit recogniser. Without it `digits`
# raises on first use and says to run tools/train_digits.py, rather than
# reading every id as somebody arbitrary.
checkit_printit = ["theme/*.sty", "gui/static/**", "data/*.npz"]
