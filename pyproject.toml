[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkit-printit"
version = "0.1.0"
description = "Print a class set of CheckIt exercises: many versions, distributed by seating, with answer keys."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# checkit-dashboard is not on PyPI under this name -- that name is the upstream
# project. Install the fork's wheel by URL; see the README.
test = ["pytest>=8"]

[project.scripts]
checkit-printit = "checkit_printit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkit_printit = ["theme/*.sty"]
